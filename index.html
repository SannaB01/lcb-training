let pendingChart = null, shownChart = null, pendingExtra = null, shownExtra = null;
function drawLineChart(host, o) {
  if (!host || !o) return;
  const series = o.series, marks = o.marks || [], tr = o.trend, dec = o.dec ?? 1;
  const W = Math.max(280, host.clientWidth || 320), H = Math.round(Math.min(280, Math.max(190, W * 0.55)));
  const pad = { l: 44, r: 14, t: 16, b: 26 };
  if (!series.length && !marks.length) {
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Noch keine Daten"><rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="var(--bg)"/><text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="var(--muted)" font-size="13">Noch keine Werte im Zeitraum</text></svg>`;
    return;
  }
  const xs = series.map((p) => p.x).concat(marks.map((p) => p.x));
  const x0 = Math.min(o.from, ...xs), x1 = Math.max(o.to, x0 + 1);
  const ys = series.map((p) => p.y).concat(marks.map((p) => p.y));
  if (tr) ys.push(tr.intercept + tr.slope * tr.x0, tr.intercept + tr.slope * tr.x1);
  if (o.refLine) ys.push(o.refLine.y);
  const band = (o.band || []).filter((b) => b.lo != null && b.hi != null);
  for (const b of band) ys.push(b.lo, b.hi);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const span = Math.max(hi - lo, o.minSpan || 1); const mid = (hi + lo) / 2;
  lo = Math.min(lo, mid - span / 2) - span * 0.12; hi = Math.max(hi, mid + span / 2) + span * 0.12;
  const step = [0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50].find((s) => (hi - lo) / s <= 5) || 100;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const sx = (x) => pad.l + (x - x0) / (x1 - x0) * (W - pad.l - pad.r);
  const sy = (y) => pad.t + (hi - y) / (hi - lo) * (H - pad.t - pad.b);
  let g = '';
  for (let i = 0; lo + i * step <= hi + 1e-9; i++) {
    const v = lo + i * step;
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v, 2)}</text>`;
  }
  const n = x1 - x0; const every = Math.max(1, Math.ceil(n / Math.floor((W - pad.l) / 46)));
  for (let x = x1; x >= x0; x -= every) { const wk = C.isoWeek(C.toIso(x * 7 * 86400000)).week; g += `<text x="${sx(x)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">KW${wk}</text>`; }
  const bandPath = band.length > 1 ? `<path d="M${band.map((b) => sx(b.x) + ',' + sy(b.hi)).join(' L')} L${band.slice().reverse().map((b) => sx(b.x) + ',' + sy(b.lo)).join(' L')}Z" fill="var(--accent)" fill-opacity=".14"/>` : '';
  const refL = o.refLine ? `<line x1="${pad.l}" x2="${W - pad.r}" y1="${sy(o.refLine.y)}" y2="${sy(o.refLine.y)}" stroke="var(--test)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${pad.l + 4}" y="${sy(o.refLine.y) - 5}" font-size="11" fill="var(--test)">${esc(o.refLine.label)} ${dec === 2 ? f2(o.refLine.y) : fmt(o.refLine.y, dec)}</text>` : '';
  const area = band.length ? '' : series.length > 1 ? `<path d="M${sx(series[0].x)},${sy(lo)} ${series.map((p) => 'L' + sx(p.x) + ',' + sy(p.y)).join(' ')} L${sx(series[series.length - 1].x)},${sy(lo)}Z" fill="var(--accent)" fill-opacity=".08"/>` : '';
  const line = series.length > 1 ? `<polyline points="${series.map((p) => sx(p.x) + ',' + sy(p.y)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>` : '';
  const dots = series.map((p, i) => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${i === series.length - 1 ? 5 : 3.5}" fill="${i === series.length - 1 ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"><title>${esc(p.title || '')}</title></circle>`).join('');
  const endLbl = series.length ? (() => { const p = series[series.length - 1]; const tx = Math.min(sx(p.x), W - pad.r - 4); return `<text x="${tx}" y="${sy(p.y) - 10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${dec === 2 ? f2(p.y) : fmt(p.y, dec)}</text>`; })() : '';
  const mdots = marks.map((p) => { const cx = sx(p.x), cy = sy(p.y); return `<path d="M${cx},${cy - 6} L${cx + 6},${cy} L${cx},${cy + 6} L${cx - 6},${cy}Z" fill="var(--test)"><title>${esc(p.title || '')}</title></path>`; }).join('');
  const tl = tr ? `<line x1="${sx(tr.x0)}" y1="${sy(tr.intercept + tr.slope * tr.x0)}" x2="${sx(tr.x1)}" y2="${sy(tr.intercept + tr.slope * tr.x1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>` : '';
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Wochenkurve ${esc(o.label || '')}">${g}${bandPath}${area}${refL}${tl}${line}${dots}${mdots}${endLbl}</svg>`;
}

/** Mehrere Reihen auf einer Achse (Vergleich, normiert in %). */
const SERIES_COLORS = ['var(--accent)', 'var(--test)', 'var(--good)', 'var(--warn)'];
function drawMultiChart(host, o) {
  if (!host) return;
  const all = o.series.flatMap((s) => s.points);
  const W = Math.max(280, host.clientWidth || 320), H = Math.round(Math.min(300, Math.max(200, W * 0.6)));
  const pad = { l: 40, r: 14, t: 14, b: 26 };
  if (!all.length) { host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Noch keine Daten"><rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="var(--bg)"/><text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="var(--muted)" font-size="13">Wähle oben Reihen mit Werten im Zeitraum</text></svg>`; return; }
  const x0 = Math.min(o.from, ...all.map((p) => p.x)), x1 = Math.max(o.to, x0 + 1);
  let lo = Math.min(100, ...all.map((p) => p.y)), hi = Math.max(100, ...all.map((p) => p.y));
  const span = Math.max(hi - lo, 10); lo -= span * 0.1; hi += span * 0.1;
  const step = [1, 2, 5, 10, 20, 25, 50].find((s) => (hi - lo) / s <= 6) || 100;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const sx = (x) => pad.l + (x - x0) / (x1 - x0) * (W - pad.l - pad.r);
  const sy = (y) => pad.t + (hi - y) / (hi - lo) * (H - pad.t - pad.b);
  let g = '';
  for (let i = 0; lo + i * step <= hi + 1e-9; i++) { const v = lo + i * step; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="${v === 100 ? 1.5 : 1}"/><text x="${pad.l - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v, 0)}</text>`; }
  const n = x1 - x0; const every = Math.max(1, Math.ceil(n / Math.floor((W - pad.l) / 46)));
  for (let x = x1; x >= x0; x -= every) g += `<text x="${sx(x)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">KW${C.isoWeek(C.toIso(x * 7 * 86400000)).week}</text>`;
  const lines = o.series.map((s, i) => {
    const col = SERIES_COLORS[i % 4];
    const pl = s.points.length > 1 ? `<polyline points="${s.points.map((p) => sx(p.x) + ',' + sy(p.y)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.25" stroke-linejoin="round"/>` : '';
    return pl + s.points.map((p) => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3.5" fill="var(--surface)" stroke="${col}" stroke-width="2"><title>${esc(s.name)} · ${esc(p.title)}</title></circle>`).join('');
  }).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Vergleich">${g}${lines}</svg>`;
}

/** Äquivalenzkurve: Bestweite je Hammergewicht (x) mit Modell-A-Kurve. */
function drawEquivChart(host, o) {
  if (!host) return;
  const W = Math.max(280, host.clientWidth || 320), H = Math.round(Math.min(280, Math.max(190, W * 0.55)));
  const pad = { l: 40, r: 14, t: 14, b: 30 };
  const ys = o.points.map((p) => p.y).concat(o.curve.map((p) => p.y));
  if (!o.points.length) { host.innerHTML = ''; return; }
  let lo = Math.min(...ys), hi = Math.max(...ys); const span = Math.max(hi - lo, 5); lo -= span * 0.1; hi += span * 0.1;
  const step = [1, 2, 5, 10, 20].find((s) => (hi - lo) / s <= 5) || 50;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const mx0 = 4.5, mx1 = 12.5;
  const sx = (x) => pad.l + (x - mx0) / (mx1 - mx0) * (W - pad.l - pad.r);
  const sy = (y) => pad.t + (hi - y) / (hi - lo) * (H - pad.t - pad.b);
  let g = '';
  for (let i = 0; lo + i * step <= hi + 1e-9; i++) { const v = lo + i * step; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; }
  for (const m of [5, 6, 7.26, 8, 9, 10, 11, 12]) g += `<text x="${sx(m)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${m === 7.26 ? 'var(--ink)' : 'var(--muted)'}">${m}</text>`;
  g += `<line x1="${sx(7.26)}" x2="${sx(7.26)}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--muted)" stroke-dasharray="3 4"/>`;
  const curve = o.curve.length ? `<polyline points="${o.curve.map((p) => sx(p.x) + ',' + sy(p.y)).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-dasharray="6 4"/>` : '';
  const pts = o.points.map((p) => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="5" fill="${p.x === 7.26 ? 'var(--test)' : 'var(--accent)'}"><title>${massLabel(p.x)}: ${f2(p.y)} m</title></circle><text x="${sx(p.x)}" y="${sy(p.y) - 9}" text-anchor="middle" font-size="11" fill="var(--ink)">${fmt(p.y, 1)}</text>`).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Äquivalenzkurve Hammergewichte">${g}${curve}${pts}</svg>`;
}

// ================= DATEN =================
function renderData() {
  const res = C.selfTest(); const ok = res.every((r) => r.pass);
  const hres = HM.selfTest();
  return `<section class="card">
    <h2>Sichern</h2>
    <p class="small muted">${S.mode === 'remote' ? 'Deine Einträge liegen privat in deinem claude.ai-Konto und sind auf jedem Gerät gleich, auf dem du angemeldet bist.'
      : sbUser ? 'Deine Einträge liegen in deinem Konto (' + esc(sbUser.email || '') + ') und werden zwischen deinen Geräten abgeglichen. Ohne Internet wird zuerst auf dem Gerät gespeichert und später übertragen.'
      : 'Deine Einträge liegen nur in diesem Browser. Exportiere regelmässig.'}
      Kraft: ${S.sets.length} Sätze, ${S.tests.length} Test-1RM · Wurf: ${S.throws.length} Weiten · Tests: ${S.results.length} Resultate.</p>
    <div class="row"><button class="btn primary" data-act="exportJson">Backup (JSON)</button></div>
    <div class="row"><button class="btn sm" data-act="exportCsv" data-k="sets">Kraft (CSV)</button><button class="btn sm" data-act="exportCsv" data-k="throws">Wurf (CSV)</button><button class="btn sm" data-act="exportCsv" data-k="results">Tests (CSV)</button></div>
    ${ui.exportText ? `<label class="small muted" for="out">Download nicht verfügbar – Text kopieren und als Datei sichern:</label><textarea id="out" class="out" readonly>${esc(ui.exportText)}</textarea><button class="btn sm" data-act="copyOut">Kopieren</button>` : ''}
  </section>
  ${sbUser ? `<section class="card">
    <h2>Konto</h2>
    <p class="small muted">Angemeldet als ${esc(sbUser.email || '')}. ${sbQueue.length ? sbQueue.length + ' Änderungen warten auf die Übertragung.' : 'Alles übertragen.'}</p>
    <div class="row"><button class="btn sm" data-act="syncNow">Jetzt synchronisieren</button><button class="btn ghost sm" data-act="logout">Abmelden</button></div>
  </section>` : ''}
  <section class="card">
    <h2>Wiederherstellen</h2>
    <p class="small muted">JSON-Backup einlesen. Vorhandene Einträge mit derselben ID werden überschrieben, nichts wird gelöscht.</p>
    <input type="file" id="importFile" accept=".json,application/json">
    ${ui.importMsg ? `<p class="small">${esc(ui.importMsg)}</p>` : ''}
  </section>
  <section class="card">
    <h2>Saison</h2>
    <label class="small muted" for="season">Saisonstart für den Zeitraum «Saison» in allen Verläufen</label>
    <input type="date" id="season" value="${esc(S.profile.seasonStart || defaultSeasonStart())}">
  </section>
  <section class="card">
    <h2>Rechenprüfung Kraft</h2>
    <p class="small ${ok ? 'ok' : 'err'}">${ok ? 'Alle 6 Testfälle aus der Spezifikation bestehen.' : 'Mindestens ein Testfall schlägt fehl.'} Formel: Epley, Schätzung bis 10 effektive Wdh.</p>
    <div class="tbl"><table class="sets small"><tbody>${res.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.got == null ? '–' : r.got}</td><td class="${r.pass ? 'ok' : 'err'}">${r.pass ? '✓' : '✗'}</td></tr>`).join('')}</tbody></table></div>
  </section>
  <section class="card">
    <h2>Rechenprüfung Prognose</h2>
    <p class="small ${hres.every((r) => r.pass) ? 'ok' : 'err'}">${hres.every((r) => r.pass) ? 'Alle ' + hres.length + ' Testfälle aus der Prognose-Spezifikation bestehen.' : 'Mindestens ein Testfall schlägt fehl.'}</p>
    <div class="tbl"><table class="sets small"><tbody>${hres.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.got == null ? '–' : r.got}</td><td class="${r.pass ? 'ok' : 'err'}">${r.pass ? '✓' : '✗'}</td></tr>`).join('')}</tbody></table></div>
  </section>`;
}

function csvOf(head, rows) {
  const q = (v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + head.join(';') + '\n' + rows.map((r) => r.map(q).join(';')).join('\n');
}
function buildCsv(kind) {
  if (kind === 'throws') {
    return csvOf(['Datum', 'KW', 'Hammer_kg', 'Draht', 'Weite_m', 'Wettkampf', 'Notiz'],
      S.throws.slice().sort((a, b) => -byDateDesc(a, b)).map((t) => [t.date, C.isoWeek(t.date).week, t.massKg, wireLabel(t.wire), f2(t.distanceM), t.isCompetition ? 'ja' : 'nein', t.note || '']));
  }
  if (kind === 'results') {
    return csvOf(['Datum', 'KW', 'Test', 'Kugel_kg', 'Resultat', 'Einheit', 'Notiz'],
      S.results.slice().sort((a, b) => -byDateDesc(a, b)).map((r) => { const t = testDef(r.testId) || {}; return [r.date, C.isoWeek(r.date).week, t.name || r.testId, r.shotKg || '', f2(r.value), t.unit || '', r.note || '']; }));
  }
  return csvOf(['Datum', 'KW', 'Übung', 'kg', 'Wdh', 'RIR', 'e1RM', 'Prozent_1RM', 'Notiz'],
    S.sets.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.order ?? 0) - (b.order ?? 0)).map((s) => {
      const ex = exById(s.exerciseId) || { id: s.exerciseId, name: '?', mode: 'load_only' };
      const e = C.setE1rm(s, ex);
      const p = C.pct(s.weightKg, C.refMax(ex, s.date, S.sets.filter((x) => x.exerciseId === ex.id), S.tests, baselineVal(blId.kraft(ex.id))));
      return [s.date, C.isoWeek(s.date).week, ex.name, s.weightKg, s.reps, s.rir ?? '', e == null ? '' : C.round1(e), p ?? '', s.note || ''];
    }));
}

async function offerFile(filename, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Datei gespeichert'); ui.exportText = ''; return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('Bitte kurz warten und erneut versuchen'); return; } }
  }
  ui.exportText = data; render();
}

async function importJson(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { ui.importMsg = 'Die Datei ist kein gültiges JSON.'; render(); return; }
  if (!d || !KINDS.some((k) => Array.isArray(d[k]))) { ui.importMsg = 'Kein Backup dieser App: keine Übungen, Sätze, Würfe oder Tests gefunden.'; render(); return; }
  let n = 0;
  ui.importMsg = 'Wird eingelesen …'; render();
  try {
    for (const k of KINDS) {
      for (const o of d[k] || []) {
        if (!o || !o.id) continue;
        const obj = { ...o, athleteId: o.athleteId || S.athleteId };
        if (backend) await backend.put(k, obj);
        const i = S[k].findIndex((x) => x.id === obj.id); if (i >= 0) S[k][i] = obj; else S[k].push(obj);
        n++;
      }
    }
    if (d.profile && typeof d.profile === 'object') await saveProfile(d.profile);
    if (!remote) localSave();
    ui.importMsg = n + ' Einträge wiederhergestellt.';
  } catch (e) { ui.importMsg = 'Abgebrochen nach ' + n + ' Einträgen. Bitte nochmals einlesen.'; }
  render();
}

// ================= Rendern & Ereignisse =================
function render() {
  const sec = SECTIONS[ui.section];
  $('#h1').textContent = sec.title;
  document.querySelectorAll('.sect button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sec === ui.section)));
  $('#gear').setAttribute('aria-pressed', String(ui.section === 'data'));
  const nav = $('#tabs');
  nav.hidden = !sec.tabs.length;
  nav.innerHTML = sec.tabs.map(([k, l]) => `<button data-tab="${k}" aria-current="${curTab() === k ? 'page' : 'false'}">${l}</button>`).join('');

  const login = S.mode === 'login';
  $('.sect').hidden = login; $('#gear').hidden = login;
  if (login) { nav.hidden = true; $('#h1').textContent = 'LCB Training'; $('#view').innerHTML = renderLogin(); return; }
  const focusId = document.activeElement && document.activeElement.id;
  const v = $('#view');
  pendingChart = null; pendingExtra = null;
  if (S.mode === 'loading' && !allLoaded() && !S.exercises.length && !S.throws.length && !S.results.length) { v.innerHTML = `<div class="card empty"><p class="muted">Daten werden geladen …</p></div>`; return; }
  const t = curTab();
  if (ui.section === 'kraft') {
    if (t === 'capture') { v.innerHTML = renderCapture(); if ($('#quick')) refreshCapture(); }
    else if (t === 'history') v.innerHTML = renderHistory();
    else if (t === 'best') v.innerHTML = renderKraftBest();
    else v.innerHTML = renderExercises();
  } else if (ui.section === 'wurf') v.innerHTML = t === 'history' ? renderWurfHistory() : t === 'best' ? renderWurfBest() : renderWurfCapture();
  else if (ui.section === 'tests') v.innerHTML = t === 'history' ? renderTestsHistory() : t === 'best' ? renderTestsBest() : renderTestsCapture();
  else if (ui.section === 'prog') v.innerHTML = t === 'compare' ? renderCompare() : renderForecast();
  else v.innerHTML = renderData();
  shownChart = pendingChart; shownExtra = pendingExtra;
  if (pendingChart) drawLineChart($('#chart'), pendingChart);
  if (pendingExtra) pendingExtra();
  if (focusId && /^(dist|tval|bl-)/.test(focusId)) { const el = document.getElementById(focusId); if (el) { el.focus(); const l = el.value.length; try { el.setSelectionRange(l, l); } catch (e) { /* egal */ } } }
}

function go(section, tab) {
  ui.section = section; if (tab) ui.tabs[section] = tab;
  ui.confirmDel = null; ui.editSet = null; ui.editRow = null;
  saveNav(); render(); window.scrollTo(0, 0);
}
document.querySelector('.sect').addEventListener('click', (e) => { const b = e.target.closest('button[data-sec]'); if (b) go(b.dataset.sec); });
$('#gear').addEventListener('click', () => go(ui.section === 'data' ? (ui.prevSection || 'kraft') : (ui.prevSection = ui.section, 'data')));
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) go(ui.section, b.dataset.tab); });

const view = $('#view');
view.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'quick') { ui.quick = e.target.value; renderPreview(); renderRefBox(); }
  else if (id === 'dist') ui.dist = e.target.value;
  else if (id === 'tval') ui.tval = e.target.value;
});
view.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.bl) { await saveBaseline(t); return; }
  if (t.id === 'date' && t.value) { ui.date = t.value; ui.editSet = null; ui.editRow = null; render(); }
  else if (t.id === 'histEx') { ui.histEx = t.value; render(); }
  else if (t.id === 'wire') { ui.wire = t.value; render(); }
  else if (t.id === 'comp') ui.comp = t.checked;
  else if (t.id === 'shot') { ui.shot = Number(t.value); render(); }
  else if (t.id === 'histResult') { ui.histResult = t.value; ui.editRow = null; render(); }
  else if (t.id === 'season' && t.value) { await saveProfile({ seasonStart: t.value }); toast('Saisonstart gespeichert'); }
  else if (t.id === 'importFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importJson(String(r.result)); r.readAsText(t.files[0]); }
});
view.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'qform') saveQuick();
  else if (e.target.id === 'wform') saveThrow();
  else if (e.target.id === 'tform') saveResult();
  else if (e.target.id === 'lform') sbLogin(false);
});
view.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr.click')) e.target.click(); });

view.addEventListener('click', async (e) => {
  const key = e.target.closest('[data-key]');
  if (key) {
    const q = $('#quick'); const k = key.dataset.key;
    q.value = k === 'back' ? q.value.slice(0, -1) : q.value + k;
    ui.quick = q.value; renderPreview(); renderRefBox(); q.focus(); return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act !== 'delSet' && act !== 'delTest' && act !== 'delRow') ui.confirmDel = null;
  switch (act) {
    case 'seed': {
      a.disabled = true;
      for (const [name, mode, unilateral, loadNote] of DEFAULT_EXERCISES) {
        const ex = { id: uid(), name, mode, unilateral, increment: 2.5, archived: false };
        if (loadNote) ex.loadNote = loadNote;
        try { await put('exercises', ex); } catch (err) { a.disabled = false; return; }
      }
      toast('12 Übungen angelegt'); render(); break;
    }
    case 'day': ui.date = C.addDays(ui.date, Number(a.dataset.d)); ui.editSet = null; ui.editRow = null; render(); break;
    case 'pickEx': ui.exId = id; ui.showTest = false; refreshCapture(); $('#quick').focus(); break;
    case 'fill': { const q = $('#quick'); q.value = a.dataset.v; ui.quick = q.value; renderPreview(); renderRefBox(); q.focus(); break; }
    case 'editSet': ui.editSet = id; renderDayList(); break;
    case 'cancelEdit': ui.editSet = null; renderDayList(); break;
    case 'saveSet': {
      const s = S.sets.find((x) => x.id === id); if (!s) break;
      const w = num($('#e-w').value), r = Number($('#e-r').value), rirRaw = $('#e-rir').value;
      if (!(w > 0) || !(r >= 1 && r <= 50)) { toast('Gewicht und Wdh prüfen'); break; }
      const rir = rirRaw === '' ? null : Number(rirRaw);
      if (rir != null && !(rir >= 0 && rir <= 5)) { toast('RIR muss zwischen 0 und 5 liegen'); break; }
      const o = { ...s, weightKg: w, reps: r }; if (rir == null) delete o.rir; else o.rir = rir;
      ui.editSet = null;
      try { await put('sets', o); toast('Satz geändert'); } catch (err) { /* Meldung kam schon */ }
      refreshCapture(); break;
    }
    case 'delSet':
    case 'delTest': {
      if (ui.confirmDel !== id) { ui.confirmDel = id; ui.section === 'kraft' && curTab() === 'capture' ? renderDayList() : render(); break; }
      ui.confirmDel = null; ui.editSet = null;
      try { await del(act === 'delSet' ? 'sets' : 'tests', id); toast('Gelöscht'); } catch (err) { /* Meldung kam schon */ }
      ui.section === 'kraft' && curTab() === 'capture' ? refreshCapture() : render(); break;
    }
    case 'toggleTest': ui.showTest = !ui.showTest; renderTestForm(); break;
    case 'saveTest': {
      const ex = currentEx(); const w = num($('#t-w').value);
      if (!ex || !(w > 0 && w <= 500)) { toast('Bitte ein Gewicht in kg eingeben'); break; }
      const note = $('#t-note').value.trim();
      const t = { id: uid(), athleteId: S.athleteId, date: ui.date, exerciseId: ex.id, weightKg: w }; if (note) t.note = note;
      ui.showTest = false;
      try { await put('tests', t); toast('Test-1RM gespeichert'); } catch (err) { /* Meldung kam schon */ }
      refreshCapture(); break;
    }
    case 'range': ui.range = a.dataset.r; render(); break;
    case 'newEx': ui.newEx = true; ui.editEx = null; render(); $('#x-name').focus(); break;
    case 'editEx': ui.editEx = id; ui.newEx = false; render(); break;
    case 'cancelEx': ui.editEx = null; ui.newEx = false; render(); break;
    case 'toggleArch': ui.showArchived = !ui.showArchived; render(); break;
    case 'saveEx': {
      const name = $('#x-name').value.trim(); if (!name) { toast('Bitte einen Namen eingeben'); break; }
      const inc = num($('#x-inc').value);
      const base = id ? exById(id) : { id: uid(), archived: false };
      const ex = { ...base, name, mode: $('#x-mode').value, unilateral: $('#x-uni').checked, increment: inc > 0 ? inc : 2.5 };
      const note = $('#x-note').value.trim(); if (note) ex.loadNote = note; else delete ex.loadNote;
      ui.editEx = null; ui.newEx = false;
      try { await put('exercises', ex); toast('Übung gespeichert'); } catch (err) { /* Meldung kam schon */ }
      render(); break;
    }
    case 'archEx': {
      const ex = exById(id); if (!ex) break;
      ui.editEx = null;
      try { await put('exercises', { ...ex, archived: !ex.archived }); toast(ex.archived ? 'Wiederhergestellt' : 'Archiviert'); } catch (err) { /* Meldung kam schon */ }
      render(); break;
    }
    // Wurf / Tests
    case 'pickMass': ui.mass = Number(a.dataset.m); ui.wire = defaultWire(ui.mass); render(); $('#dist').focus(); break;
    case 'pickTestId': ui.testId = id; if (testDef(id).shot) ui.shot = defaultShot(id); ui.tval = ''; render(); $('#tval').focus(); break;
    case 'pickCombo': ui.histCombo = a.dataset.k; ui.editRow = null; render(); break;
    case 'editRow': ui.editRow = id; render(); break;
    case 'cancelRow': ui.editRow = null; render(); break;
    case 'saveRow': {
      const kind = a.dataset.kind; const o = S[kind].find((x) => x.id === id); if (!o) break;
      const v = num($('#er-v').value); const note = $('#er-note').value.trim();
      const n = { ...o };
      if (kind === 'throws') {
        if (!(v >= 5 && v <= 100)) { toast('Bitte eine Weite zwischen 5 und 100 m eingeben'); break; }
        n.distanceM = Math.round(v * 100) / 100; n.isCompetition = $('#er-comp').checked;
      } else {
        const t = testDef(o.testId);
        if (!(v >= t.min && v <= t.max)) { toast(`Bitte einen Wert zwischen ${t.min} und ${t.max} ${t.unit} eingeben`); break; }
        n.value = Math.round(v * 100) / 100;
      }
      if (note) n.note = note; else delete n.note;
      ui.editRow = null;
      try { await put(kind, n); toast('Geändert'); } catch (err) { /* Meldung kam schon */ }
      render(); break;
    }
    case 'delRow': {
      if (ui.confirmDel !== id) { ui.confirmDel = id; render(); break; }
      ui.confirmDel = null; ui.editRow = null;
      try { await del(a.dataset.kind, id); toast('Gelöscht'); } catch (err) { /* Meldung kam schon */ }
      render(); break;
    }
    case 'addBlCombo': {
      const k = comboKey(Number($('#bl-mass').value), $('#bl-wire').value);
      if (!ui.blCombos.includes(k)) ui.blCombos.push(k);
      render(); const el = document.getElementById('bl-' + blId.wurf(Number($('#bl-mass').value), $('#bl-wire').value)); if (el) el.focus();
      break;
    }
    // Prognose / Vergleich
    case 'cmpToggle': {
      const k = a.dataset.k; const i = (ui.cmp || []).indexOf(k);
      if (i >= 0) ui.cmp.splice(i, 1);
      else if (ui.cmp.length >= 4) { toast('Höchstens vier Reihen – zuerst eine abwählen'); break; }
      else ui.cmp.push(k);
      render(); break;
    }
    case 'cmpNorm': ui.cmpNorm = a.dataset.n; render(); break;
    case 'signup': sbLogin(true); break;
    case 'logout': sbLogout(); break;
    case 'syncNow': sbSync(); break;
    // Daten
    case 'exportJson': {
      const d = { app: 'kraftaufbau', version: 2, exportedAt: new Date().toISOString(), athleteId: S.athleteId, profile: S.profile };
      for (const k of KINDS) d[k] = S[k];
      offerFile('trainingsapp-backup-' + todayIso() + '.json', JSON.stringify(d, null, 2)); break;
    }
    case 'exportCsv': {
      const k = a.dataset.k; const name = { sets: 'kraft', throws: 'wurf', results: 'tests' }[k];
      offerFile(name + '-' + todayIso() + '.csv', buildCsv(k)); break;
    }
    case 'copyOut': {
      const ta = $('#out');
      try { await navigator.clipboard.writeText(ta.value); toast('Kopiert'); } catch (err) { ta.select(); toast('Text markiert – jetzt kopieren'); }
      break;
    }
  }
});

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (shownChart && $('#chart')) drawLineChart($('#chart'), shownChart); if (shownExtra) shownExtra(); }, 150); });

render();
initStore();
</script>
